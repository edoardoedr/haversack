# Lung lobes, trachea and lung vessels for every patient in input_dir.
#   python batch_segment.py configs/lungs.toml

input_dir = "/path/to/patients"          # every *.nii.gz / *.nii in it is one patient
output_dir = "/path/to/segmentations"    # one subfolder per patient

device = "auto"            # auto, mps, cuda, cpu
overwrite = false          # true re-runs patients whose masks are already there
save_multilabel = false    # true also writes each task's whole label map
cache_models = 1           # models kept in memory between patients (more is faster, uses more memory)

# Lung lobes and trachea from TotalSegmentator's 1.5 mm models, the finest it ships
# (total_fast is the 3 mm one). `total` is five 1.5 mm models; with roi set, only the ones
# holding these structures run - here the organs model alone (Dataset291).
[[segmentations]]
task = "ts.v2:total"
roi_subset = true          # false runs all five models, as `total` does without a roi
roi = [
    "lung_upper_lobe_left",
    "lung_lower_lobe_left",
    "lung_upper_lobe_right",
    "lung_middle_lobe_right",
    "lung_lower_lobe_right",
    "trachea",
]

# Airways, airway wall, arteries and veins (no roi: every structure of the task).
[[segmentations]]
task = "ts.v2:lung_vessels"
