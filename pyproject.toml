[project]
name = "haversack"
version = "0.16.0"
description = "Medical-image segmentation models, many families behind one door: TotalSegmentator, MOOSE, MRSegmentator, stock nnU-Net and more, on MPS, CUDA or CPU, with a CLI and a local REST server"
readme = "README.md"
license = { file = "LICENSE" }
# 3.12 to 3.14 (2026-09-25). 3.12 is the floor (zarr 3.3 and duckn need it). The cap was 3.12
# from 2026-09-12 until FastSurfer ran on 3.14: its argparse types (`str | None`) were refused
# as not callable by 3.14's argparse - fixed in the fork (fastsurfer-lean lean4), not upstream.
# Measured then: the fast suite passes on 3.12, 3.13 and 3.14, and FastSurfer (ds000114 sub-09)
# and ts.v2:total_fast (CT_Abdo) write byte-identical labels on 3.14 and 3.12. CI runs 3.12 and
# 3.14. The Modal images and the dev env (`.python-version`) stay on 3.12, where every
# measured run in this repository's records was made; moving them is its own change.
requires-python = ">=3.12,<3.15"
dependencies = [
    "numpy",
    "tqdm",
    # the wire's typed vocabulary (haversack.schemas): one declaration generates the
    # published JSON Schema, the submit-time validation and the OpenAPI document.
    # 27 ms to import, 7.8 MB on disk - noise next to SimpleITK's 183 MB, and it
    # is already present wherever `serve` is installed (FastAPI depends on it).
    "pydantic>=2",
    # SITK is core: reading/writing images and spacing-aware resampling are
    # part of segmenting, which is what the package is for. `uv run` installs it.
    "SimpleITK",
    # The inference stack is core (2026-09-03): a package whose point is running models
    # must run them after a bare install - `uvx git+.../haversack segment` is the first
    # thing a new user types, and it died on `import torch` while torch was an extra.
    # torch >= 2.7 for torch.mps.compile_shader; nnunetv2 for the network architecture,
    # weights and sliding-window slicers (stock APIs only); scipy builds the resampler's
    # exact operators; scikit-image is the test-only reference. numpy is left unpinned so
    # the synthstrip engine's numpy<2 fork still resolves beside core. A lean install
    # (client / describe-only, no torch) is `--no-deps` plus the first five names above -
    # see README "Lean install"; extras can only add.
    "torch>=2.7",
    "nnunetv2",
    "scipy",
    "scikit-image",
    # obstore is core (2026-09-03): `haversack segment idc:<uuid>` should work from a bare
    # install, and the IDC source is how the demo cases come in. A small Rust wheel, no
    # further dependencies.
    "obstore",
    # provender is the content-addressed blob store, shared with feldglas (2026-09-20). It
    # was `objectcache.BlobStore` here until a second project needed the same thing, and one
    # copy of a protocol is the only way two of them do not drift. stdlib + obstore, with
    # obstore imported at call time, so a lean install pays nothing for it.
    "provender>=0.1.6",
    # The command line (2026-09-11): click gives each command its own function, `--version`,
    # shell completion, and help for positionals, which click added in 8.5 - hence the floor.
    # typer was weighed: it is click underneath plus rich, shellingham and a pre-1.0 API, for
    # help this project prints plain, and it had been dropped on 2026-09-07, imported nowhere.
    "click>=8.5",
    # duckn, zarr, rankfield and pydicom are core (2026-09-25, the user's call: "duckn is now
    # essentially necessary"). Every cached input is kept as a duckn zarr copy (pydicom is its
    # DICOM data dictionary), a task's rank field is a duckn store encoded by rankfield, and
    # every deployed image already carried them. 14.3 MB beside core. duckn and rankfield come
    # from git tags, as provender does - which is why an install needs `uv pip`, not pip. The
    # default `segment IN -o labels.nii.gz` still imports none of them (rule 6, test_layering).
    "duckn>=0.6.3",
    "zarr>=3.3",
    "rankfield>=0.3.11",
    # labelfield is the fused restore - logits to labels on any grid, the Metal / Triton / torch
    # kernels and their geometry - lifted out of haversack into its own package (2026-09-27).
    # torch + numpy, as the kernel layer always was (test_layering). A direct git reference, not a
    # [tool.uv.sources] tag: rankfield depends on it that way (so `pip install rankfield` resolves
    # it), and uv reads a tag source and a URL for one package as "conflicting URLs" even when they
    # name one commit - the two must be the same string. main pins tags (a release); the dev
    # branch tracks the siblings' dev branches.
    "labelfield @ git+https://github.com/mhalle/labelfield.git@v0.1.5",
    "pydicom>=2.4",
    # FastSurfer is core (2026-09-25, the user's call): the fork's inference needs nothing core
    # does not already bring (nnU-Net pulls pandas, nibabel, yacs, ...), so it adds 0.9 MB, and a
    # FastSurfer rank field's restore lateralizes the cortex with FastSurfer's own rule. Its
    # weights (64 MB) still download on first use. The engine is on wherever it is installed
    # unless HAVERSACK_FASTSURFER=0, so its tasks are listed and a Modal deploy builds its
    # worker by default. It raises torch's floor to 2.14 (the fork's).
    "fastsurfer-lean",
]
# NOTE: mlx is NOT a core dependency (moved to the `mlx` extra below, 2026-08-26).
# The product is torch/MPS-first (haversack); MLX is the oracle-only path. Keeping mlx
# in core made the whole package uninstallable where mlx has no wheels (Linux/CUDA/
# Modal) - CI had to avoid `uv sync` and hand-list deps for exactly this reason, and
# the per-engine images mount the package + hand-list rather than `pip install haversack[...]`.
# With mlx optional, core installs anywhere and uv-native `uv sync --extra <x>` works.

[project.scripts]
# haversack is the only executable. The MLX-era commands (nnmlx, TotalSegmentator, totalseg-mlx)
# are gone (2026-09-02): `uv tool install` put all four on PATH, three of them crashing
# without mlx and one shadowing a real TotalSegmentator.
haversack = "haversack.cli:main"

[project.optional-dependencies]
# There is no mlx extra. The MLX oracle haversack is checked against lives in its own
# repository, nnunet-inference-mlx; this package never imports it (tests/test_layering.py).
# Remote weight download (store.download / download_archive).
remote = ["httpx"]
# The REST job server (haversack serve).
serve = ["matplotlib", "fastapi", "uvicorn", "python-multipart"]
# Deploying the server to Modal (haversack modal deploy).
modal = ["modal"]
# Multi-label connected-component cleanup (segment --remove-small-components-mm3).
postprocessing = ["connected-components-3d"]
# The artifact-preview renderer. Every serve WORKER renders previews in the artifact
# overlap (serve-core render_preview imports matplotlib), so a worker image whose engine
# extra doesn't already bring matplotlib includes this. Kept out of an engine's own deps
# because it's a serve-tier concern, not the engine's.
preview = ["matplotlib"]
# CUDA-only acceleration for the nnU-Net worker: the Triton restore backend (picked
# automatically on CUDA). No macOS/Linux-CPU wheels, so it is opt-in - only the GPU base
# image syncs it. haversack falls back to the numpy/torch restore without it.
cuda = ["triton>=3.0"]   # enable_fp_fusion as a launch option: the ranked restore needs it
test = ["pytest", "pydicom", "fastapi", "httpx", "python-multipart"]
# `[torch]` is an empty alias kept so that `haversack[torch]` in existing commands and docs
# still installs (the stack is core since 2026-09-03).
torch = []
# The SynthStrip engine: the model + conform live in the standalone `synthstrip-torch`
# package (like fastsurfer-lean; git tag in [tool.uv.sources]), which brings torch + surfa +
# SimpleITK. scipy is haversack's (the post-restore mask cleanup). Until synthstrip-torch 0.1.1
# (2026-09-25) it pinned numpy<2 for surfa's reorient, and this extra conflicted with core and
# lived in its own environment; 0.1.1 takes surfa at upstream's unreleased NumPy 2 fix
# (8aa4a5f6), measured bit-identical, and the engine installs beside the others.
synthstrip = ["synthstrip-torch", "scipy"]
# `[fastsurfer]`: the engine's code is core (fastsurfer-lean, 2026-09-25); this extra adds its
# WEIGHTS on disk (fastsurfer-vinn-weights: the three VINN v2.0.0 checkpoints, 67 MB, Apache-2.0,
# unmodified from Zenodo), 2026-09-26. Without it the checkpoints are fetched from Zenodo on
# first use, as before. The FastSurfer worker's image installs it, so a deploy no longer fetches
# from Zenodo while the image builds (a Zenodo 504 failed two deploys, 2026-09-07). The fork
# (mhalle/fastsurfer-lean) exists because upstream's package list omits FastSurferCNN's
# subpackages, and now also for 3.14 and a lean dependency set; both tags are in [tool.uv.sources].
fastsurfer = ["fastsurfer-vinn-weights"]
# The VoxTell engine (haversack.engines.voxtell): free-text promptable segmentation from
# MIC-DKFZ. It pins `torch>=2.0,<2.9`, which override-dependencies below lifts (2026-09-12,
# verified on torch 2.14); it keeps its own environment, in the conflicts group below, until
# it is shown to install beside the others. The package
# brings its own tree (nnunetv2, dynamic-network-architectures, transformers,
# huggingface_hub); weights + the precomputed text-embedding bank come from the HF hub.
# PROJECT MODE ONLY (`uv sync --extra voxtell`, as its Modal image does): voxtell pins
# torch<2.9, which only [tool.uv] override-dependencies lifts, and `uv pip install
# 'haversack[voxtell]'` does not read it - with fastsurfer-lean core (torch>=2.14) that no
# longer resolves (review, 2026-09-25). Experimental, Modal-only; no README line installs it.
voxtell = ["voxtell"]
# The MONAI engine: a CATALOG of model-zoo bundles, not one model. `monai` brings the
# runtime; the rest is the union of the curated bundles' own required_packages_version
# (tools/gen_monai_manifest.py prints it), because a bundle carries its own transform
# chain and therefore its own deps. Conflicting with the other engines below, as ever.
monai = ["monai>=1.4", "torch>=2.7", "nibabel", "itk", "pytorch-ignite", "einops",
         "timm", "scikit-learn", "tensorboard", "fire", "PyYAML"]
# `[duckn]` is an empty alias since its packages became core (2026-09-25), kept so that
# `haversack[duckn]` in existing commands, docs and every Modal image's extras still installs.
duckn = []
# `haversack embed` (2026-09-23): an encoder's token lattices written as an embedding field. The
# field format is feldglas's, and feldglas is its one author - haversack hands it the tokens and
# writes through `feldglas.store` (zarr + duckn's own models, like the ranked stores). The networks
# need the torch extra (RADAR's encoder is built from nnU-Net's dynamic_network_architectures);
# RADAR's input convention reorients through nibabel, as upstream's DataFolder does.
embed = ["feldglas>=0.2.7", "nibabel"]                    # duckn, zarr and rankfield are core

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true             # labelfield, a direct git reference (above)

[tool.hatch.build.targets.wheel]
packages = ["src/haversack"]
# The task catalogs ship whatever .gitignore says: hatch skips VCS-ignored files, and a
# `data/` rule in the workspace .gitignore once swallowed src/haversack/data - a wheel built from
# the pushed branch had no catalog, and every `haversack segment` died on a missing
# ts_tasks.json (2026-09-02). `artifacts` (not force-include, which would add the files a
# second time now that they are tracked) makes them part of the normal selection.
artifacts = ["src/haversack/data/*.json", "src/haversack/data/*.md", "src/haversack/data/*.html"]

[tool.hatch.build.targets.wheel.force-include]
# The README is the user guide, and `haversack docs` prints it from inside the wheel; an
# editable checkout reads the repository's README instead (cli.user_guide) - one source.
"README.md" = "haversack/data/GUIDE.md"
# The server guide, the same way: `haversack docs --server`, and the server's own OpenAPI
# description is drawn from it.
"SERVER.md" = "haversack/data/SERVER.md"

[tool.uv]
# Engines own their environments (docs: "one environment per engine") when their deps
# genuinely conflict (synthstrip's numpy<2 until synthstrip-torch 0.1.1; voxtell's torch<2.9 against core's, until
# override-dependencies lifted it - voxtell keeps its own environment until it is shown to
# install beside the others); those are
# declared here so uv resolves them in separate forks of ONE universal lock. fastsurfer left
# the group 2026-09-03: the fork's torch pin was upstream's CUDA-11 caution, relaxed, and the
# engine now installs into the main environment (`uv sync --extra fastsurfer`) -
# the same declaration then drives per-engine venvs locally and per-engine images on Modal.
# A future engine with its own incompatible pins adds an extra + one entry here.
# voxtell's `torch<2.9` is a leftover of torch 2.9.0's 3D-convolution slowdown under AMP
# (pytorch#166122, fixed in 2.10; VoxTell's authors report 2.10 and 2.11 fine), so it is
# overridden (2026-09-12). Verified on Modal: a VoxTell worker on torch 2.14.0+cu130 (L40S)
# segmented an NLST chest CT - four prompts, plausible volumes, ~8 GB GPU memory of 46.
# An override replaces EVERY torch requirement in the graph - synthstrip-torch's and monai's
# too, both since run on 2.14 on Modal (SynthStrip, then beside surfa's numpy 1.26; two MONAI
# bundles) - so all engines resolve one torch (2.14 today).
override-dependencies = ["torch>=2.10"]
# synthstrip left every group 2026-09-25 (synthstrip-torch 0.1.1 runs on numpy 2); the two
# groups that existed only for its numpy<2 - against duckn and embed - went with it.
conflicts = [
    [
      { extra = "voxtell" },
      { extra = "monai" },
    ],
]

[tool.uv.sources]
rankfield = { git = "https://github.com/mhalle/rankfield.git", tag = "v0.3.11" }
provender = { git = "https://github.com/mhalle/provender.git", tag = "v0.1.6" }
# nnunetv2 comes from PyPI: haversack uses only stock nnunetv2 APIs (verified against 2.8.1). It
# used to be a `path = "../upstream/nnUNet"` source here, but uv applies these sources to a
# `git+https://...` install too, and that relative path exists only in the dev workspace - so
# every outside install failed before downloading anything (2026-09-02). For upstream work
# put the checkout in by hand: `uv pip install -e ../upstream/nnUNet`.
# fastsurfer-lean = our slimmed FastSurfer fork (parcellation CNN only, packaging fixed).
# Pinned to a tag cut from an upstream RELEASE (2026-09-12): `v<release>-lean<n>` is
# upstream's `v<release>` with only pyproject.toml changed. It was a dev snapshot before,
# code the maintainers had not released or validated. The release in the tag is the
# engine's weights identity (engines/registry.py), and a test holds the two together.
# Import namespace stays FastSurferCNN.
fastsurfer-lean = { git = "https://github.com/mhalle/fastsurfer-lean.git", tag = "v2.5.4-lean4" }
# the FastSurferVINN checkpoints as a package (one commit, tagged with the checkpoints' version)
fastsurfer-vinn-weights = { git = "https://github.com/mhalle/fastsurfer-vinn-weights.git", tag = "v2.0.0" }
# voxtell = MIC-DKFZ's free-text promptable segmentation. Pinned to a git rev, not the
# PyPI release: 0.1.0 on PyPI predates helpers this engine uses (download_voxtell_model),
# and pinning the rev means the source we integrated against is the source that runs.
voxtell = { git = "https://github.com/MIC-DKFZ/VoxTell.git", rev = "8ef0332aec5d5dff925d6f6370386c00334b57ab" }
# duckn = the metadata standard the ranked stores are written in (seg extension 0.8 as of
# 0.4.0). A release tag, not a branch, so a sync is reproducible; to work on duckn itself,
# `uv pip install -e ../duckn` after the sync puts the sibling checkout in front of it.
duckn = { git = "https://github.com/mhalle/duckn.git", tag = "v0.6.3" }
# feldglas = the embedding-field format and its receiving end (client, `feldglas` command); haversack
# writes fields through it. A release tag, like duckn; `uv pip install -e ../feldglas` after the
# sync to work on both.
feldglas = { git = "https://github.com/mhalle/feldglas.git", tag = "v0.2.7" }
# synthstrip-torch = our standalone SynthStrip inference package (StripModel + surfa conform
# + SDT; weights fetched from MGH at runtime). Import namespace: synthstrip_torch.
synthstrip-torch = { git = "https://github.com/mhalle/synthstrip-torch.git", tag = "v0.1.1" }

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: heavy benchmarks (deselect with '-m not slow')"]
